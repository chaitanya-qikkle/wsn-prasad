<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="1570" viewBox="0 0 1130 1570" font-family="Arial, Helvetica, sans-serif"><style>.s{fill:#fff;stroke:#000;stroke-width:1.5}.l{fill:none;stroke:#000;stroke-width:1.4}.d{stroke-dasharray:6 4}.g{fill:none;stroke:#000;stroke-width:1.2;stroke-dasharray:8 5}text{fill:#000}</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#000"/></marker></defs><rect width="1130" height="1570" fill="#fff"/><rect x="270.0" y="18.0" width="130" height="44" rx="22.0" class="s"/><text x="335" y="45.2" font-size="15" text-anchor="middle" font-weight="bold">Start</text><rect x="180.0" y="97.0" width="310" height="56" class="s"/><text x="335" y="120.7" font-size="15" text-anchor="middle">Deploy WSN: Sink, Cluster Heads,</text><text x="335" y="139.8" font-size="15" text-anchor="middle">Relays, Gateway and Sensor nodes</text><rect x="180.0" y="187.0" width="310" height="56" class="s"/><text x="335" y="210.7" font-size="15" text-anchor="middle">Initialise trust and energy of each</text><text x="335" y="229.8" font-size="15" text-anchor="middle">node; create Genesis block</text><rect x="180.0" y="283.0" width="310" height="44" class="s"/><text x="335" y="300.7" font-size="15" text-anchor="middle">Start round (every 2 seconds);</text><text x="335" y="319.8" font-size="15" text-anchor="middle">apply any injected attack</text><rect x="180.0" y="363.0" width="310" height="44" class="s"/><text x="335" y="380.7" font-size="15" text-anchor="middle">Select next node</text><text x="335" y="399.8" font-size="15" text-anchor="middle">(skip Sink and dead nodes)</text><polygon points="335,438.0 455.0,490 335,542.0 215.0,490" class="s"/><text x="335" y="485.7" font-size="15" text-anchor="middle">Is node</text><text x="335" y="504.8" font-size="15" text-anchor="middle">isolated?</text><rect x="180.0" y="577.0" width="310" height="56" class="s"/><text x="335" y="600.7" font-size="15" text-anchor="middle">Forward packets; monitor drop ratio,</text><text x="335" y="619.8" font-size="15" text-anchor="middle">delay and identity behaviour</text><rect x="180.0" y="667.0" width="310" height="56" class="s"/><text x="335" y="690.7" font-size="15" text-anchor="middle">Calculate penalty and update</text><text x="335" y="709.8" font-size="15" text-anchor="middle">trust score (WTE)</text><polygon points="335,753.0 455.0,805 335,857.0 215.0,805" class="s"/><text x="335" y="800.7" font-size="15" text-anchor="middle">Trust score</text><text x="335" y="819.8" font-size="15" text-anchor="middle">&lt; 0.40 ?</text><rect x="180.0" y="892.0" width="310" height="56" class="s"/><text x="335" y="915.7" font-size="15" text-anchor="middle">Raise detection event; isolate node</text><text x="335" y="934.8" font-size="15" text-anchor="middle">and remove it from routing</text><polygon points="335,1023.0 455.0,1075 335,1127.0 215.0,1075" class="s"/><text x="335" y="1070.7" font-size="15" text-anchor="middle">All nodes</text><text x="335" y="1089.8" font-size="15" text-anchor="middle">evaluated?</text><polygon points="335,1153.0 455.0,1205 335,1257.0 215.0,1205" class="s"/><text x="335" y="1200.7" font-size="15" text-anchor="middle">Any detection</text><text x="335" y="1219.8" font-size="15" text-anchor="middle">in this round?</text><rect x="180.0" y="1297.0" width="310" height="56" class="s"/><text x="335" y="1320.7" font-size="15" text-anchor="middle">Rebuild TA-AODV routes (RREQ / RREP),</text><text x="335" y="1339.8" font-size="15" text-anchor="middle">avoiding isolated and dead nodes</text><rect x="180.0" y="1393.0" width="310" height="44" class="s"/><text x="335" y="1420.2" font-size="15" text-anchor="middle">Update metrics and dashboard</text><polygon points="335,1458.0 435.0,1500 335,1542.0 235.0,1500" class="s"/><text x="335" y="1495.7" font-size="15" text-anchor="middle">Simulation</text><text x="335" y="1514.8" font-size="15" text-anchor="middle">stopped?</text><polyline points="335,62 335,97" class="l" marker-end="url(#a)"/><polyline points="335,153 335,187" class="l" marker-end="url(#a)"/><polyline points="335,243 335,283" class="l" marker-end="url(#a)"/><polyline points="335,327 335,363" class="l" marker-end="url(#a)"/><polyline points="335,407 335,438" class="l" marker-end="url(#a)"/><polyline points="335,542 335,577" class="l" marker-end="url(#a)"/><polyline points="335,633 335,667" class="l" marker-end="url(#a)"/><polyline points="335,723 335,753" class="l" marker-end="url(#a)"/><polyline points="335,857 335,892" class="l" marker-end="url(#a)"/><polyline points="335,1127 335,1153" class="l" marker-end="url(#a)"/><polyline points="335,1257 335,1297" class="l" marker-end="url(#a)"/><polyline points="335,1353 335,1393" class="l" marker-end="url(#a)"/><polyline points="335,948 335,1023" class="l" marker-end="url(#a)"/><text x="349" y="562" font-size="15" text-anchor="start">No</text><text x="349" y="875" font-size="15" text-anchor="start">Yes</text><text x="349" y="1145" font-size="15" text-anchor="start">Yes</text><text x="321" y="1274" font-size="15" text-anchor="end">No</text><polygon points="690,440.0 800.0,490 690,540.0 580.0,490" class="s"/><text x="690" y="485.7" font-size="15" text-anchor="middle">Attack still</text><text x="690" y="504.8" font-size="15" text-anchor="middle">active?</text><polygon points="690,575.0 800.0,625 690,675.0 580.0,625" class="s"/><text x="690" y="620.7" font-size="15" text-anchor="middle">Quarantine of</text><text x="690" y="639.8" font-size="15" text-anchor="middle">3 rounds over?</text><rect x="565.0" y="737.0" width="250" height="56" class="s"/><text x="690" y="760.7" font-size="15" text-anchor="middle">Remediation: clear attack</text><text x="690" y="779.8" font-size="15" text-anchor="middle">behaviour of the node</text><rect x="840.0" y="562.0" width="250" height="56" class="s"/><text x="965" y="585.7" font-size="15" text-anchor="middle">Probation:</text><text x="965" y="604.8" font-size="15" text-anchor="middle">trust = trust + 0.08</text><polygon points="965,655.0 1075.0,705 965,755.0 855.0,705" class="s"/><text x="965" y="700.7" font-size="15" text-anchor="middle">Trust score</text><text x="965" y="719.8" font-size="15" text-anchor="middle">≥ 0.65 ?</text><rect x="840.0" y="822.0" width="250" height="56" class="s"/><text x="965" y="845.7" font-size="15" text-anchor="middle">Readmit node to</text><text x="965" y="864.8" font-size="15" text-anchor="middle">routing pool</text><polyline points="455.0,490 580,490" class="l" marker-end="url(#a)"/><text x="467.0" y="481" font-size="15" text-anchor="start">Yes</text><polyline points="690,540 690,575" class="l" marker-end="url(#a)"/><text x="702" y="563" font-size="15" text-anchor="start">Yes</text><polyline points="800,490 965,490 965,562" class="l" marker-end="url(#a)"/><text x="812" y="481" font-size="15" text-anchor="start">No</text><polyline points="965,618 965,655" class="l" marker-end="url(#a)"/><polyline points="965,755 965,822" class="l" marker-end="url(#a)"/><text x="977" y="785" font-size="15" text-anchor="start">Yes</text><polyline points="690,675 690,737" class="l" marker-end="url(#a)"/><text x="702" y="705" font-size="15" text-anchor="start">Yes</text><polyline points="580,625 530,625 530,985" class="l"/><text x="568" y="616" font-size="15" text-anchor="end">No</text><polyline points="690,793 690,985" class="l"/><polyline points="855,705 825,705 825,985" class="l"/><text x="843" y="696" font-size="15" text-anchor="end">No</text><polyline points="965,878 965,985 335,985" class="l"/><circle cx="530" cy="985" r="3.2" fill="#000"/><circle cx="690" cy="985" r="3.2" fill="#000"/><circle cx="825" cy="985" r="3.2" fill="#000"/><polyline points="215.0,805 160,805 160,985 335,985" class="l"/><text x="203.0" y="796" font-size="15" text-anchor="end">No</text><circle cx="335" cy="985" r="3.2" fill="#000"/><polyline points="215.0,1075 105,1075 105,385 180.0,385" class="l" marker-end="url(#a)"/><text x="203.0" y="1066" font-size="15" text-anchor="end">No</text><rect x="585.0" y="1169.0" width="330" height="72" class="s"/><text x="750" y="1191.2" font-size="15" text-anchor="middle">Mine one block (SHA-256 Proof-of-Work,</text><text x="750" y="1210.2" font-size="15" text-anchor="middle">difficulty 2) with Merkle root and</text><text x="750" y="1229.3" font-size="15" text-anchor="middle">append it to the ledger</text><polyline points="455.0,1205 585,1205" class="l" marker-end="url(#a)"/><text x="467.0" y="1196" font-size="15" text-anchor="start">Yes</text><polyline points="750,1241 750,1277 335,1277" class="l"/><circle cx="335" cy="1277" r="3.2" fill="#000"/><polyline points="235,1500 50,1500 50,305 180.0,305" class="l" marker-end="url(#a)"/><text x="223" y="1491" font-size="15" text-anchor="end">No</text><polyline points="435,1500 560,1500" class="l" marker-end="url(#a)"/><text x="447" y="1491" font-size="15" text-anchor="start">Yes</text><rect x="560.0" y="1478.0" width="130" height="44" rx="22.0" class="s"/><text x="625" y="1505.2" font-size="15" text-anchor="middle" font-weight="bold">End</text></svg>